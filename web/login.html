<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/assets/icon-192.png"><title>GOLD AI Login</title></head><body class="login-body"><main class="login-wrap"><section class="card login-card"><div class="login-logo"><img src="/assets/icon.svg"><div><h1>GOLD AI Pro</h1><p>Live XAU/USD Intelligence</p></div></div><h2>تسجيل الدخول</h2><p class="muted">أدخل اسم المستخدم وكلمة السر التي أنشأها المسؤول.</p><label class="field">Username<input id="u" autocomplete="username" autocapitalize="none"></label><label class="field">Password<input id="p" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn wide">دخول</button><p id="msg" class="login-message"></p></section></main><script>
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn'),userInput=document.getElementById('u'),passInput=document.getElementById('p');async function login(){const username=userInput.value.trim();if(!username||!passInput.value){msg.textContent='أدخل اسم المستخدم وكلمة السر';return}btn.disabled=true;msg.textContent='جاري التحقق…';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:passInput.value})});const j=await r.json();if(!r.ok||!j.ok)throw Error('بيانات الدخول غير صحيحة');localStorage.setItem('gold_token',j.token);localStorage.setItem('gold_username',j.username||username);location.replace('/')}catch(e){msg.textContent=e.message||'تعذر تسجيل الدخول'}finally{btn.disabled=false}}btn.onclick=login;passInput.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
