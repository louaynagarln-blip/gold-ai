name: Validate GOLD AI Web Quality
on:
  push:
    branches: [web-quality-v4-2]
    paths: ['web/**', '.github/workflows/web-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: web
