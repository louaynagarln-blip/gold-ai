name: Build Android Demo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages
        id: android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        id: gradle
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            build-diagnostics.log
            app/build/reports
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-GOLD-TRADER-DEMO-APK
          path: app/build/outputs/apk/debug/*.apk
