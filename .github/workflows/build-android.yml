name: Build Android Demo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build-diagnostics.log
      - name: Save build error for remote diagnosis
        if: failure()
        shell: bash
        run: |
          test -f build-diagnostics.log || echo "Failure occurred before Gradle compilation. Inspect Actions setup steps." > build-diagnostics.log
          tail -n 250 build-diagnostics.log > LAST_BUILD_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_BUILD_ERROR.txt
          git commit -m "Save latest Android build error" || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-GOLD-TRADER-DEMO-APK
          path: app/build/outputs/apk/debug/*.apk
