name: Build Android Demo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages
        id: android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        id: gradle
        with:
          gradle-version: '8.9'
      - name: Engine safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            build-diagnostics.log
            app/build/reports
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-GOLD-TRADER-DEMO-APK
          path: app/build/outputs/apk/debug/*.apk

  android-ui:
    strategy:
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.aigoldtrader.demo/.MainActivity
            sleep 2
            adb shell pidof com.aigoldtrader.demo
            adb shell screencap -p /sdcard/dashboard.png
            adb pull /sdcard/dashboard.png dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            dashboard.png
